name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check pull request route
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$GITHUB_BASE_REF/$GITHUB_HEAD_REF" in
            dev/feat/?*) exit 0 ;;
            main/dev|dev/main)
              if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
                exit 0
              fi
              ;;
          esac
          echo 'Open feat/* → dev, dev → main, or main → dev for synchronization.'
          exit 1

      - name: Verify repository files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test -s README.md
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
