name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ github.event_name == 'pull_request' && 'verify' || 'smoke' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify PR route and changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test -s README.md
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
            git show --format= --check HEAD
            exit 0
          fi

          test -n "$BASE_SHA"

          case "$GITHUB_BASE_REF/$GITHUB_HEAD_REF" in
            dev/feat/?*) ;;
            main/dev)
              [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
              ;;
            *)
              echo 'Open feat/* → dev or dev → main.'
              exit 1
              ;;
          esac
          git diff --check "$BASE_SHA" HEAD
